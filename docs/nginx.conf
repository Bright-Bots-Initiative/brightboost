server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # BRAND_R0: non-production hosts must not be indexed. ROBOTS_TAG is a
    # Railway service variable ("noindex, nofollow" on staging/preview); the
    # Dockerfile defaults it to "" and nginx omits a header whose value is
    # empty, so production stays indexable. Inherited by every location below
    # that does not declare its own add_header.
    add_header X-Robots-Tag "${ROBOTS_TAG}" always;

    # Make sure static assets are cached properly
    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        expires max;
        log_not_found off;
    }

    # Proxy API requests to backend
    location /api/ {
       proxy_pass ${BACKEND_URL}/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    proxy_ssl_server_name on;
    }

    # All routes go to index.html for SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
